[project]
name = "ducktective-core"
version = "0.1.0"
description = "Домен: агрегаты, value objects, доменные события, порты"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
