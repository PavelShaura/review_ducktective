[project]
name = "ducktective-vcs"
version = "0.1.0"
description = "Провайдеры систем контроля версий и разбор диффов"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "unidiff>=0.7.5",
]

[tool.uv.sources]
ducktective-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
