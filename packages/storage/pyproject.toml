[project]
name = "ducktective-storage"
version = "0.1.0"
description = "Хранилище: SQLAlchemy, репозитории агрегатов, Unit of Work, миграции"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-dotenv>=1.0",
    "pgvector>=0.3.6",
    "redis>=5.2",
]

[tool.uv.sources]
ducktective-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
