[project]
name = "ducktective-application"
version = "0.1.0"
description = "Use cases: оркестрация домена и границы транзакций"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
]

[tool.uv.sources]
ducktective-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
