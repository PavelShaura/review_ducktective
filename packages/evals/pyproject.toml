[project]
name = "ducktective-evals"
version = "0.1.0"
description = "Оценка качества ревью: наборы случаев, прогон, метрики"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "ducktective-application",
    "ducktective-storage",
    "ducktective-vcs",
    "rich>=13.9",
]

[tool.uv.sources]
ducktective-core = { workspace = true }
ducktective-application = { workspace = true }
ducktective-storage = { workspace = true }
ducktective-vcs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
