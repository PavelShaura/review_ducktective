[project]
name = "ducktective-auth"
version = "0.1.0"
description = "Проверка личности по OIDC и доступ к провайдеру личности"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[tool.uv.sources]
ducktective-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
