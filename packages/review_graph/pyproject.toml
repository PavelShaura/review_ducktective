[project]
name = "ducktective-review-graph"
version = "0.1.0"
description = "Граф ревью на LangGraph: типизированное состояние и узлы конвейера"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
ducktective-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
