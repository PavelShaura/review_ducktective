[project]
name = "ducktective-llm"
version = "0.1.0"
description = "Доступ к языковым моделям: роутинг, кэш, разбор структурированных ответов"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "litellm>=1.59",
    "pydantic>=2.10",
    "redis>=5.2",
]

[tool.uv.sources]
ducktective-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
