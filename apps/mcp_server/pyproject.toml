[project]
name = "ducktective-mcp-server"
version = "0.1.0"
description = "MCP-сервер навигации по проиндексированной кодовой базе"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "ducktective-config",
    "ducktective-application",
    "ducktective-storage",
    "ducktective-retrieval",
    "ducktective-llm",
    "ducktective-observability",
    "mcp>=1.2",
    "python-dotenv>=1.0",
]

[project.scripts]
ducktective-mcp = "ducktective.mcp_server.__main__:main"

[tool.uv.sources]
ducktective-core = { workspace = true }
ducktective-config = { workspace = true }
ducktective-application = { workspace = true }
ducktective-storage = { workspace = true }
ducktective-retrieval = { workspace = true }
ducktective-llm = { workspace = true }
ducktective-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
