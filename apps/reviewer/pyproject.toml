[project]
name = "ducktective-reviewer"
version = "0.1.0"
description = "Воркер фоновых прогонов ревью"
requires-python = ">=3.12"

dependencies = [
    "ducktective-core",
    "ducktective-config",
    "ducktective-application",
    "ducktective-storage",
    "ducktective-llm",
    "ducktective-observability",
    "arq>=0.26",
    "redis>=5.2",
]

[tool.uv.sources]
ducktective-core = { workspace = true }
ducktective-config = { workspace = true }
ducktective-application = { workspace = true }
ducktective-storage = { workspace = true }
ducktective-llm = { workspace = true }
ducktective-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktective"]
